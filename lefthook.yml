output:
  - failure

# Git hooks. Installed automatically by `npm install` (prepare script).
commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml}'
      run: npx --no -- prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  commands:
    scripts-tests:
      run: npm run --silent test:scripts
    app-checks:
      root: app/
      run: npm run --silent lint && npm run --silent typecheck
