name: Bug
description: Alguna cosa no funciona com hauria.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Què passa?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos per reproduir-ho
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Què hauria de passar?
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      multiple: true
      options: [iOS, Android, Backend]
  - type: input
    id: version
    attributes:
      label: Versió de l'app / build
