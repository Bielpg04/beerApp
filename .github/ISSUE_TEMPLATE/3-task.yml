name: Subtasca
description: Unitat de feina d'una user story. Una subtasca = una branca = una PR.
title: "US-XXX-TN · "
labels: [task]
body:
  - type: input
    id: parent
    attributes:
      label: User story
      placeholder: "#NN · US-XXX · ..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Detall
  - type: input
    id: branch
    attributes:
      label: Branca
      description: Surt de la branca de la US i hi torna amb squash merge.
      placeholder: task/us-xxx-tn-descripcio
