# GitHub only auto-closes issues ("Closes #N") when a PR merges into the default branch.
# Task PRs merge into feature branches, so close their linked issues here.
name: Close linked issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          for n in $numbers; do
            echo "Closing #$n"
            gh issue close "$n" --repo "$REPO" --comment "Tancat en fer merge de #$PR." || true
          done
