name: Database

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: 0

jobs:
  db:
    name: DB (migrations, pgTAP, lint, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - run: npm ci
      - name: Start Postgres and apply migrations + seed
        run: supabase db start && supabase db reset
      - name: pgTAP tests
        run: supabase test db
      - name: Schema lint
        run: supabase db lint --schema public --level warning --fail-on warning
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code app/src/types/database.ts || {
            echo "::error::app/src/types/database.ts is stale. Run 'npm run db:types' and commit it."
            exit 1
          }
