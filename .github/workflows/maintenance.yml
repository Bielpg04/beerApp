# Free-tier housekeeping for the hosted Supabase projects.
# - Daily keep-alive: free projects pause after 7 days without activity.
# - Weekly backup of production (schema + data), encrypted because artifacts of a
#   public repo can be downloaded by any GitHub user. Kept for 90 days.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL_DEV, SUPABASE_DB_URL_PROD  Postgres connection strings (session pooler)
#   BACKUP_PASSPHRASE                          passphrase for the encrypted backups
# Decrypt: gpg --decrypt backup-<date>.tar.gpg > backup.tar
name: Maintenance

on:
  schedule:
    - cron: '17 6 * * *' # daily keep-alive
    - cron: '43 3 * * 0' # weekly backup (Sunday)
  workflow_dispatch:
    inputs:
      backup:
        description: Also take a backup now
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [DEV, PROD]
    env:
      DB_URL: ${{ matrix.project == 'DEV' && secrets.SUPABASE_DB_URL_DEV || secrets.SUPABASE_DB_URL_PROD }}
    steps:
      - name: Ping database
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL_${{ matrix.project }} is not configured; skipping"
            exit 0
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'alive', now()"

  backup:
    if: github.event.schedule == '43 3 * * 0' || inputs.backup
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::SUPABASE_DB_URL_PROD or BACKUP_PASSPHRASE not configured; skipping backup"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.ok == 'true'
        with:
          version: 3.0.0
      - name: Dump roles, schema and data
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir backup
          supabase db dump --remote="$DB_URL" --role-only -f backup/roles.sql
          supabase db dump --remote="$DB_URL" -f backup/schema.sql
          supabase db dump --remote="$DB_URL" --data-only --use-copy -f backup/data.sql
          tar -cf backup.tar backup
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Encrypt
        if: steps.check.outputs.ok == 'true'
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 --output "backup-$STAMP.tar.gpg" backup.tar <<< "$BACKUP_PASSPHRASE"
          rm -rf backup backup.tar
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.ok == 'true'
        with:
          name: supabase-prod-backup-${{ env.STAMP }}
          path: backup-*.tar.gpg
          retention-days: 90
          if-no-files-found: error
