<!doctype html>
<html>
  <body
    style="
      margin: 0;
      background: #fffdf8;
      font-family:
        -apple-system,
        Segoe UI,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #1a1410;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            style="max-width: 480px; background: #ffffff; border: 1px solid #eae2d4; border-radius: 20px"
          >
            <tr>
              <td style="padding: 32px">
                <p style="font-size: 28px; margin: 0 0 8px">🍺 BeerApp</p>
                <p style="margin: 0 0 4px">
                  El teu codi per entrar · Tu código para entrar · Your sign-in code
                </p>
                <p
                  style="
                    font-size: 36px;
                    font-weight: 700;
                    letter-spacing: 8px;
                    margin: 24px 0;
                    color: #8a5a08;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 4px; color: #6b6158; font-size: 14px">
                  Caduca en 10 minuts · Caduca en 10 minutos · Expires in 10 minutes
                </p>
                <p style="margin: 16px 0 0; color: #6b6158; font-size: 13px">
                  Si no l'has demanat, ignora aquest correu. · Si no lo has pedido, ignora este correo. · If
                  you didn't ask for it, ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
